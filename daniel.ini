ruleset=默认,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
; ==========================================================
; AI
custom_proxy_group=AI`select`[]节点`[]日本节点`[]香港节点`[]台湾节点`[]韩国节点`[]新加坡节点`[]美国节点`[]欧洲节点`[]自动`[]DIRECT
; Apple
custom_proxy_group=Apple`select`[]DIRECT`[]节点`[]日本节点`[]香港节点`[]台湾节点`[]韩国节点`[]新加坡节点`[]美国节点`[]欧洲节点`[]自动
